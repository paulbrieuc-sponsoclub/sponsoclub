<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsoclub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
  :root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--text:#1a1d21;--muted:#6b7280;--faint:#9ca3af;
    --border:#e5e7eb;--bstrong:#d1d5db;--accent:#3b4cd8;--accentbg:#eceefb;--accenttx:#2b3aab;
    --green:#159169;--greenbg:#e2f4ee;--amber:#b5730f;--amberbg:#fbf0dd;--radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  .top{background:#14161c;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}
  .top .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px}
  .top h1{font-size:16px;font-weight:600}
  .top .me{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:#c7cbd6}
  .wrap{max-width:1080px;margin:0 auto;padding:22px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  h2{font-size:15px;font-weight:600;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--bstrong);border-radius:8px;font-family:inherit;font-size:14px;background:var(--surface)}
  button{font-family:inherit;font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--bstrong);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  button:hover{background:var(--surface2)} button:active{transform:scale(.98)} button i{font-size:16px}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#3341bf}
  .link{background:none;border:none;color:var(--accenttx);cursor:pointer;font-size:13px;padding:4px}
  .sect{margin-top:24px}
  .item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .ic{width:38px;height:38px;border-radius:9px;background:var(--accentbg);color:var(--accenttx);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .grow{flex:1;min-width:0}.t{font-size:14px;font-weight:500}.s{font-size:12.5px;color:var(--muted);margin-top:1px}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.gray{background:var(--surface2);color:var(--muted)}
  .muted{color:var(--muted);font-size:12.5px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--accentbg);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:30px;text-align:center;color:var(--faint)}
  dialog{border:none;border-radius:14px;padding:0;max-width:640px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .dlg-b{padding:18px 20px;max-height:70vh;overflow:auto}
  pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.7;background:var(--surface2);border-radius:10px;padding:14px 16px}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
  .pack{border:1px solid var(--border);border-radius:10px;padding:12px}.pack.reco{border:2px solid var(--accent)}
  .pack .tier{font-size:12px;color:var(--muted)}.pack .price{font-size:18px;font-weight:600}
  /* auth */
  #auth{max-width:400px;margin:8vh auto;padding:0 20px}
  .authcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 24px;box-shadow:0 4px 20px rgba(16,24,40,.06)}
  .brandbig{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px}
  .brandbig .logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .brandbig span{font-size:20px;font-weight:700}
  .msg{font-size:12.5px;margin-top:10px;padding:8px 10px;border-radius:8px;display:none}
  .msg.err{background:#fdecec;color:#a12; display:block}.msg.ok{background:var(--greenbg);color:var(--green);display:block}
  .field{margin-bottom:12px}
</style>
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="auth">
  <div class="brandbig"><div class="logo"><i class="ti ti-trophy"></i></div><span>Sponsoclub</span></div>
  <div class="authcard">
    <h2 id="auth-title" style="text-align:center">Connexion</h2>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="vous@club.fr"></div>
    <div class="field"><label>Mot de passe</label><input id="pass" type="password" placeholder="••••••••"></div>
    <button class="primary" id="auth-btn" style="width:100%;justify-content:center" onclick="doAuth()">Se connecter</button>
    <div style="text-align:center;margin-top:8px"><button class="link" id="auth-switch" onclick="switchMode()">Pas encore de compte ? Créer un compte</button></div>
    <div id="auth-msg" class="msg"></div>
  </div>
  <p class="muted" style="text-align:center;margin-top:14px">Prototype Sponsoclub · données réelles (annuaire des entreprises)</p>
</div>

<!-- APPLICATION -->
<div id="app" style="display:none">
  <div class="top">
    <div class="logo"><i class="ti ti-trophy"></i></div>
    <h1>Sponsoclub</h1>
    <div class="me"><span id="who"></span><button onclick="logout()" style="color:#fff;border-color:#333;background:#1d2029"><i class="ti ti-logout"></i> Déconnexion</button></div>
  </div>
  <div class="wrap">
    <div class="card">
      <h2>Profil du club</h2>
      <div class="grid">
        <div><label>Nom du club</label><input id="nom"></div>
        <div><label>Adresse du stade</label><input id="adr"></div>
        <div><label>Sport</label><input id="sport" value="Rugby"></div>
        <div><label>Licenciés</label><input id="lic" type="number" value="240"></div>
        <div><label>Spectateurs / match</label><input id="spec" type="number" value="600"></div>
        <div><label>Abonnés réseaux</label><input id="res" type="number" value="3200"></div>
        <div><label>Rayon (km)</label><input id="ray" type="number" value="3" min="1" max="20"></div>
        <div style="display:flex;align-items:flex-end;gap:8px">
          <button onclick="saveProfile()"><i class="ti ti-device-floppy"></i> Enregistrer</button>
          <button class="primary" style="flex:1;justify-content:center" onclick="run()"><i class="ti ti-map-search"></i> Détecter</button>
        </div>
      </div>
      <div id="status" class="muted" style="margin-top:12px"></div>
    </div>

    <div class="sect">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Prospects détectés</h2><span class="muted" id="rescount"></span>
      </div>
      <div class="card" id="results"><div class="empty">Renseigne l'adresse du stade puis lance la détection.</div></div>
    </div>

    <div class="sect">
      <h2>Pipeline <span class="muted" id="pipcount"></span></h2>
      <div class="card" id="pipeline"><div class="empty">Chargement…</div></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-h"><strong id="dlg-title">Dossier</strong><button onclick="document.getElementById('dlg').close()" aria-label="Fermer"><i class="ti ti-x"></i></button></div>
  <div class="dlg-b" id="dlg-body"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIGURATION ======
const SUPABASE_URL = "https://pizltvprhpbtxgpymjsq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpemx0dnByaHBidHhncHltanNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODczNDksImV4cCI6MjEwMDg2MzM0OX0.zb5UbvyiDM9fHkpZTKIx2QwxPosMgd9lpUGilA_kMP8";
// ============================

const $=id=>document.getElementById(id);
let sb=null, user=null, prospects=[], signupMode=false;

if(SUPABASE_ANON_KEY==="COLLE_ICI_TA_CLE_ANON"){
  $("auth-msg").className="msg err";
  $("auth-msg").textContent="Configuration à finir : colle ta clé anon Supabase dans le fichier (ligne SUPABASE_ANON_KEY).";
}else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=>{ if(data.session){user=data.session.user;showApp();} });
}

function switchMode(){
  signupMode=!signupMode;
  $("auth-title").textContent=signupMode?"Créer un compte":"Connexion";
  $("auth-btn").textContent=signupMode?"Créer mon compte":"Se connecter";
  $("auth-switch").textContent=signupMode?"Déjà un compte ? Se connecter":"Pas encore de compte ? Créer un compte";
  $("auth-msg").className="msg";
}
async function doAuth(){
  if(!sb){return;}
  const email=$("email").value.trim(), pass=$("pass").value;
  const m=$("auth-msg"); m.className="msg";
  if(!email||!pass){m.className="msg err";m.textContent="Renseigne email et mot de passe.";return;}
  let res;
  if(signupMode) res=await sb.auth.signUp({email,password:pass});
  else res=await sb.auth.signInWithPassword({email,password:pass});
  if(res.error){m.className="msg err";m.textContent=res.error.message;return;}
  if(res.data.session){user=res.data.session.user;showApp();}
  else {m.className="msg ok";m.textContent="Compte créé. Vérifie tes emails si une confirmation est demandée, puis connecte-toi.";signupMode=false;switchMode();switchMode();}
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function showApp(){
  $("auth").style.display="none"; $("app").style.display="block";
  $("who").textContent=user.email;
  await loadProfile(); await loadPipe();
}
async function loadProfile(){
  const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(data){ $("nom").value=data.club_nom||""; $("adr").value=data.adresse||""; $("sport").value=data.sport||"Rugby";
    $("lic").value=data.licencies||240; $("spec").value=data.spectateurs||600; $("res").value=data.reseaux||3200; }
}
async function saveProfile(){
  const row={id:user.id,club_nom:$("nom").value,adresse:$("adr").value,sport:$("sport").value,
    licencies:+$("lic").value||0,spectateurs:+$("spec").value||0,reseaux:+$("res").value||0,updated_at:new Date().toISOString()};
  const {error}=await sb.from("profiles").upsert(row);
  $("status").innerHTML=error?('<span style="color:#a12">Erreur: '+error.message+'</span>'):'<i class="ti ti-circle-check" style="color:var(--green)"></i> Profil enregistré.';
}

// ---- Détection (données publiques réelles) ----
function cat(naf){const d=(naf||"").slice(0,2);const m={"47":["Commerce de détail","ti-building-store",3],"56":["Restauration","ti-tools-kitchen-2",3],"45":["Automobile","ti-car",3],"96":["Services aux particuliers","ti-cut",3],"10":["Alimentaire","ti-bread",3],"68":["Immobilier","ti-home",2],"86":["Santé","ti-medical-cross",2],"43":["Artisanat","ti-hammer",2],"41":["Construction","ti-building",2],"49":["Transport","ti-truck",2],"69":["Conseil","ti-briefcase",2],"55":["Hébergement","ti-bed",2],"93":["Sport/loisirs","ti-ballpen",2]};return m[d]||["Entreprise locale","ti-building",1];}
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function cn(n){return n.replace(/\b([A-ZÀ-Ÿ]{2,})\b/g,w=>w.charAt(0)+w.slice(1).toLowerCase());}
function ml(s){return s>=4?["match élevé","green"]:s>=3?["match moyen","amber"]:["à qualifier","gray"];}
async function geocode(q){const r=await fetch("https://api-adresse.data.gouv.fr/search/?limit=1&q="+encodeURIComponent(q));if(!r.ok)throw new Error("geo");const d=await r.json();if(!d.features||!d.features.length)throw new Error("adresse introuvable");const f=d.features[0];return{lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],label:f.properties.label};}
async function nearby(lat,lon,rad){const r=await fetch(`https://recherche-entreprises.api.gouv.fr/near_point?lat=${lat}&long=${lon}&radius=${rad}&per_page=25&page=1`);if(!r.ok)throw new Error("entreprises");const d=await r.json();return d.results||[];}
function normalize(list,clat,clon){return list.map(e=>{const s=e.siege||{};const name=e.nom_complet||e.nom_raison_sociale||s.nom_commercial||"Établissement";const naf=e.activite_principale||s.activite_principale||"";const [cl,ic,base]=cat(naf);const el=parseFloat(s.latitude),eo=parseFloat(s.longitude);let dist=null;if(!isNaN(el)&&!isNaN(eo))dist=hav(clat,clon,el,eo);let sc=base;if(dist!=null){if(dist<1)sc++;else if(dist>4)sc--;}return{name:cn(name),cl,ic,sc,dist,ville:s.libelle_commune||""};}).filter(x=>x.sc>=1).sort((a,b)=>b.sc-a.sc||((a.dist??99)-(b.dist??99))).slice(0,20);}
async function run(){
  const adr=$("adr").value.trim();const rad=Math.min(20,Math.max(1,+$("ray").value||3));
  $("status").innerHTML='<span class="spin"></span> Géocodage…'; $("results").innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{const g=await geocode(adr);$("status").innerHTML='<span class="spin"></span> Recherche autour de « '+g.label+' »…';const raw=await nearby(g.lat,g.lon,rad);prospects=normalize(raw,g.lat,g.lon);if(!prospects.length)throw new Error("aucun résultat");$("status").innerHTML='<i class="ti ti-circle-check" style="color:var(--green)"></i> '+prospects.length+' commerces détectés autour de '+g.label+'.';}
  catch(err){prospects=demo();$("status").innerHTML='<i class="ti ti-alert-triangle" style="color:var(--amber)"></i> API indisponible ('+err.message+') — démonstration chargée.';}
  renderResults();
}
function renderResults(){
  $("rescount").textContent=prospects.length+" commerces";
  if(!prospects.length){$("results").innerHTML='<div class="empty">Aucun commerce.</div>';return;}
  $("results").innerHTML=prospects.map((p,i)=>{const[l,c]=ml(p.sc);const d=p.dist!=null?(p.dist<1?Math.round(p.dist*1000)+" m":p.dist.toFixed(1)+" km"):"—";return `<div class="item"><div class="ic"><i class="ti ${p.ic}"></i></div><div class="grow"><div class="t">${p.name}</div><div class="s">${p.cl} · ${d}${p.ville?" · "+p.ville:""}</div></div><span class="pill ${c}">${l}</span><button class="primary" onclick="dossier(${i})"><i class="ti ti-sparkles"></i> Dossier</button></div>`;}).join("");
}
function dossier(i){
  const p=prospects[i];const c={nom:$("nom").value||"votre club",lic:+$("lic").value||0,spec:+$("spec").value||0,res:+$("res").value||0};
  const email=`Objet : ${p.name} sur les maillots du ${c.nom} ?\n\nBonjour,\n\nJe suis en charge des partenariats du ${c.nom} — ${c.lic} licenciés et environ ${c.spec} spectateurs par match, beaucoup de familles installées à quelques minutes de chez vous.\n\nNous cherchons des partenaires locaux pour la saison. En échange d'un soutien, votre enseigne serait visible auprès de ce public : panneau au stade, logo sur nos tenues, relais réseaux (${c.res} abonnés). Trois formules, de 300 à 1 500 €.\n\nAuriez-vous 15 minutes cette semaine ?\n\nBien à vous,\n${c.nom}`;
  $("dlg-title").textContent="Dossier · "+p.name;
  $("dlg-body").innerHTML=`<p class="muted" style="margin-bottom:10px">${p.cl}${p.ville?" · "+p.ville:""}</p>
    <div class="packs"><div class="pack"><div class="tier">Bronze</div><div class="price">300 €</div><div class="muted">logo site · 4 posts/an</div></div>
    <div class="pack reco"><div class="tier">Argent</div><div class="price">800 €</div><div class="muted">+ panneau · logo short · 12 posts</div></div>
    <div class="pack"><div class="tier">Or</div><div class="price">1 500 €</div><div class="muted">+ logo maillot · match parrainé</div></div></div>
    <label style="margin-bottom:6px">Email d'approche</label><pre id="mail">${email.replace(/</g,"&lt;")}</pre>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="navigator.clipboard.writeText(document.getElementById('mail').innerText);this.innerHTML='<i class=\\'ti ti-check\\'></i> Copié'"><i class="ti ti-copy"></i> Copier l'email</button>
      <button class="primary" onclick="addPipe(${i})"><i class="ti ti-plus"></i> Ajouter au pipeline</button>
    </div>`;
  $("dlg").showModal();
}
async function addPipe(i){
  const p=prospects[i];
  const {error}=await sb.from("pipeline").insert({name:p.name,categorie:p.cl,statut:"À contacter"});
  $("dlg").close();
  if(error){alert("Erreur: "+error.message);return;}
  loadPipe();
}
async function loadPipe(){
  const {data,error}=await sb.from("pipeline").select("*").order("created_at",{ascending:false});
  if(error){$("pipeline").innerHTML='<div class="empty">Erreur: '+error.message+'</div>';return;}
  $("pipcount").textContent=data.length?("· "+data.length):"";
  if(!data.length){$("pipeline").innerHTML='<div class="empty">Ajoute un commerce depuis « Dossier ».</div>';return;}
  const opts=["À contacter","Contacté","RDV","Signé","Perdu"];
  $("pipeline").innerHTML=data.map(p=>`<div class="item"><div class="ic"><i class="ti ti-building-store"></i></div>
    <div class="grow"><div class="t">${p.name}</div><div class="s">${p.categorie||""}</div></div>
    <select onchange="setStatut(${p.id},this.value)" style="width:150px">${opts.map(o=>`<option ${p.statut===o?"selected":""}>${o}</option>`).join("")}</select>
    <button onclick="delPipe(${p.id})" aria-label="Supprimer" style="padding:8px"><i class="ti ti-trash"></i></button></div>`).join("");
}
async function setStatut(id,v){ await sb.from("pipeline").update({statut:v}).eq("id",id); }
async function delPipe(id){ await sb.from("pipeline").delete().eq("id",id); loadPipe(); }
function demo(){return [
  {name:"Garage Central",cl:"Automobile",ic:"ti-car",dist:1.2,sc:4,ville:"Villeneuve"},
  {name:"Boulangerie Moreau",cl:"Alimentaire",ic:"ti-bread",dist:0.6,sc:4,ville:"Villeneuve"},
  {name:"Pizza Bella",cl:"Restauration",ic:"ti-tools-kitchen-2",dist:0.9,sc:4,ville:"Villeneuve"},
  {name:"Agence Immo du Parc",cl:"Immobilier",ic:"ti-home",dist:2.4,sc:3,ville:"Villeneuve"}
];}
</script>
</body>
</html>
