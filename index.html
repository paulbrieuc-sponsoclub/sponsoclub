<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsoclub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
  :root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--text:#1a1d21;--muted:#6b7280;--faint:#9ca3af;
    --border:#e5e7eb;--bstrong:#d1d5db;--accent:#3b4cd8;--accentbg:#eceefb;--accenttx:#2b3aab;
    --green:#159169;--greenbg:#e2f4ee;--amber:#b5730f;--amberbg:#fbf0dd;--radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  .top{background:#14161c;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}
  .top .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px}
  .top h1{font-size:16px;font-weight:600}
  .top .me{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:#c7cbd6}
  .wrap{max-width:1080px;margin:0 auto;padding:22px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  h2{font-size:15px;font-weight:600;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  input:not([type=checkbox]),select{width:100%;padding:9px 11px;border:1px solid var(--bstrong);border-radius:8px;font-family:inherit;font-size:14px;background:var(--surface)}
  .cp{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--text)}
  .cp:hover{background:var(--surface2)}
  .cp input{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);margin:0;cursor:pointer}
  .cp:has(input:checked){background:var(--greenbg);border-color:#bfe3d4;color:var(--green)}
  button{font-family:inherit;font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--bstrong);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  button:hover{background:var(--surface2)} button:active{transform:scale(.98)} button i{font-size:16px}
  button:disabled{opacity:.4;cursor:default} button:disabled:hover{background:var(--surface)}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#3341bf}
  .link{background:none;border:none;color:var(--accenttx);cursor:pointer;font-size:13px;padding:4px}
  .sect{margin-top:24px}
  .item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .ic{width:38px;height:38px;border-radius:9px;background:var(--accentbg);color:var(--accenttx);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .grow{flex:1;min-width:0}.t{font-size:14px;font-weight:500}.s{font-size:12.5px;color:var(--muted);margin-top:1px}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.gray{background:var(--surface2);color:var(--muted)}
  .muted{color:var(--muted);font-size:12.5px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--accentbg);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:30px;text-align:center;color:var(--faint)}
  #kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 18px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .kpi-l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .kpi-v{font-size:26px;font-weight:600;letter-spacing:-.02em}
  dialog{border:none;border-radius:16px;padding:0;width:min(720px,94vw);max-height:88vh;overflow:hidden;margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border)}
  .dlg-h strong{font-size:16px}
  .dlg-b{padding:20px 24px;max-height:calc(88vh - 62px);overflow:auto}
  pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.7;background:var(--surface2);border-radius:10px;padding:14px 16px}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
  .pack{border:1px solid var(--border);border-radius:10px;padding:12px}.pack.reco{border:2px solid var(--accent)}
  .pack .tier{font-size:12px;color:var(--muted)}.pack .price{font-size:18px;font-weight:600}
  /* auth */
  #auth{max-width:400px;margin:8vh auto;padding:0 20px}
  .authcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 24px;box-shadow:0 4px 20px rgba(16,24,40,.06)}
  .brandbig{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px}
  .brandbig .logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .brandbig span{font-size:20px;font-weight:700}
  .msg{font-size:12.5px;margin-top:10px;padding:8px 10px;border-radius:8px;display:none}
  .msg.err{background:#fdecec;color:#a12; display:block}.msg.ok{background:var(--greenbg);color:var(--green);display:block}
  .field{margin-bottom:12px}
</style>
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="auth">
  <div class="brandbig"><div class="logo"><i class="ti ti-trophy"></i></div><span>Sponsoclub</span></div>
  <div class="authcard">
    <h2 id="auth-title" style="text-align:center">Connexion</h2>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="vous@club.fr"></div>
    <div class="field"><label>Mot de passe</label><input id="pass" type="password" placeholder="••••••••"></div>
    <button class="primary" id="auth-btn" style="width:100%;justify-content:center" onclick="doAuth()">Se connecter</button>
    <div style="text-align:center;margin-top:8px"><button class="link" id="auth-switch" onclick="switchMode()">Pas encore de compte ? Créer un compte</button></div>
    <div id="auth-msg" class="msg"></div>
  </div>
  <p class="muted" style="text-align:center;margin-top:14px">Prototype Sponsoclub · données réelles (annuaire des entreprises)</p>
</div>

<!-- APPLICATION -->
<div id="app" style="display:none">
  <div class="top">
    <div class="logo"><i class="ti ti-trophy"></i></div>
    <h1>Sponsoclub</h1>
    <div class="me"><span id="who"></span><button onclick="logout()" style="color:#fff;border-color:#333;background:#1d2029"><i class="ti ti-logout"></i> Déconnexion</button></div>
  </div>
  <div class="wrap">
    <div id="kpis"></div>
    <div class="card">
      <h2>Profil du club</h2>
      <div class="grid">
        <div><label>Nom du club</label><input id="nom"></div>
        <div><label>Adresse du stade</label><input id="adr"></div>
        <div><label>Sport</label><input id="sport" value="Rugby"></div>
        <div><label>Licenciés</label><input id="lic" type="number" value="240"></div>
        <div><label>Spectateurs / match</label><input id="spec" type="number" value="600"></div>
        <div><label>Abonnés réseaux</label><input id="res" type="number" value="3200"></div>
        <div><label>Rayon (km)</label><input id="ray" type="number" value="5" min="1" max="20"></div>
        <div style="display:flex;align-items:flex-end;gap:8px">
          <button onclick="saveProfile()"><i class="ti ti-device-floppy"></i> Enregistrer</button>
          <button class="primary" style="flex:1;justify-content:center" onclick="run()"><i class="ti ti-map-search"></i> Détecter</button>
        </div>
      </div>
      <div id="status" class="muted" style="margin-top:12px"></div>
    </div>

    <div class="sect">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Prospects détectés</h2><span class="muted" id="rescount"></span>
      </div>
      <div class="card" id="results"><div class="empty">Renseigne l'adresse du stade puis lance la détection.</div></div>
    </div>

    <div class="sect">
      <h2>Pipeline <span class="muted" id="pipcount"></span></h2>
      <div class="card" id="pipeline"><div class="empty">Chargement…</div></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-h"><strong id="dlg-title">Dossier</strong><button onclick="document.getElementById('dlg').close()" aria-label="Fermer"><i class="ti ti-x"></i></button></div>
  <div class="dlg-b" id="dlg-body"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIGURATION ======
const SUPABASE_URL = "https://pizltvprhpbtxgpymjsq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpemx0dnByaHBidHhncHltanNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODczNDksImV4cCI6MjEwMDg2MzM0OX0.zb5UbvyiDM9fHkpZTKIx2QwxPosMgd9lpUGilA_kMP8";
// ============================

const $=id=>document.getElementById(id);
let sb=null, user=null, prospects=[], signupMode=false, curPage=1;
const PAGE=10;
let pipeData=[], spSaved={};

if(SUPABASE_ANON_KEY==="COLLE_ICI_TA_CLE_ANON"){
  $("auth-msg").className="msg err";
  $("auth-msg").textContent="Configuration à finir : colle ta clé anon Supabase dans le fichier (ligne SUPABASE_ANON_KEY).";
}else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=>{ if(data.session){user=data.session.user;showApp();} });
}

function switchMode(){
  signupMode=!signupMode;
  $("auth-title").textContent=signupMode?"Créer un compte":"Connexion";
  $("auth-btn").textContent=signupMode?"Créer mon compte":"Se connecter";
  $("auth-switch").textContent=signupMode?"Déjà un compte ? Se connecter":"Pas encore de compte ? Créer un compte";
  $("auth-msg").className="msg";
}
async function doAuth(){
  if(!sb){return;}
  const email=$("email").value.trim(), pass=$("pass").value;
  const m=$("auth-msg"); m.className="msg";
  if(!email||!pass){m.className="msg err";m.textContent="Renseigne email et mot de passe.";return;}
  let res;
  if(signupMode) res=await sb.auth.signUp({email,password:pass});
  else res=await sb.auth.signInWithPassword({email,password:pass});
  if(res.error){m.className="msg err";m.textContent=res.error.message;return;}
  if(res.data.session){user=res.data.session.user;showApp();}
  else {m.className="msg ok";m.textContent="Compte créé. Vérifie tes emails si une confirmation est demandée, puis connecte-toi.";signupMode=false;switchMode();switchMode();}
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function showApp(){
  $("auth").style.display="none"; $("app").style.display="block";
  $("who").textContent=user.email;
  await loadProfile(); await loadPipe();
}
async function loadProfile(){
  const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(data){ $("nom").value=data.club_nom||""; $("adr").value=data.adresse||""; $("sport").value=data.sport||"Rugby";
    $("lic").value=data.licencies||240; $("spec").value=data.spectateurs||600; $("res").value=data.reseaux||3200; }
}
async function saveProfile(){
  const row={id:user.id,club_nom:$("nom").value,adresse:$("adr").value,sport:$("sport").value,
    licencies:+$("lic").value||0,spectateurs:+$("spec").value||0,reseaux:+$("res").value||0,updated_at:new Date().toISOString()};
  const {error}=await sb.from("profiles").upsert(row);
  $("status").innerHTML=error?('<span style="color:#a12">Erreur: '+error.message+'</span>'):'<i class="ti ti-circle-check" style="color:var(--green)"></i> Profil enregistré.';
}

// ---- Détection (données publiques réelles) ----
function cat(naf){const d=(naf||"").slice(0,2);const m={
  "56":["Restauration / café / bar","ti-tools-kitchen-2",3],
  "47":["Commerce de détail","ti-building-store",3],
  "10":["Boulangerie / alimentaire","ti-bread",3],
  "11":["Boissons","ti-bottle",3],
  "45":["Automobile","ti-car",3],
  "96":["Coiffure / esthétique / pressing","ti-cut",3],
  "86":["Santé (pharmacie, kiné…)","ti-medical-cross",3],
  "55":["Hôtel / hébergement","ti-bed",2],
  "68":["Immobilier","ti-home",2],
  "43":["Artisan (plombier, élec…)","ti-hammer",2],
  "41":["Construction","ti-building",2],
  "74":["Photo / design / déco","ti-camera",2],
  "90":["Culture / spectacle","ti-masks-theater",2],
  "93":["Sport / loisirs","ti-ballpen",2],
  "49":["Transport","ti-truck",1],
  "69":["Conseil / juridique","ti-briefcase",1],
  "70":["Gestion / holding","ti-briefcase",1]
};return m[d]||["Entreprise locale","ti-building",1];}
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function cn(n){return n.replace(/\b([A-ZÀ-Ÿ]{2,})\b/g,w=>w.charAt(0)+w.slice(1).toLowerCase());}
function ml(s){return s>=4?["match élevé","green"]:s>=3?["match moyen","amber"]:["à qualifier","gray"];}
function initials(n){const w=n.split(/\s+/).filter(x=>x.length>1);return (w.slice(0,2).map(x=>x[0]).join("")||n[0]||"?").toUpperCase();}
function hue(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return `hsl(${h},42%,47%)`;}
function vign(p){if(p.photo)return `<img src="${p.photo}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0">`;return `<div style="width:44px;height:44px;border-radius:10px;background:${hue(p.name)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0;position:relative">${initials(p.name)}<span style="position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#fff;color:#14161c;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 0 1px #e5e7eb"><i class="ti ${p.ic}"></i></span></div>`;}
async function geocode(q){const r=await fetch("https://api-adresse.data.gouv.fr/search/?limit=1&q="+encodeURIComponent(q));if(!r.ok)throw new Error("geo");const d=await r.json();if(!d.features||!d.features.length)throw new Error("adresse introuvable");const f=d.features[0];return{lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],label:f.properties.label};}
async function nearby(lat,lon,rad){let all=[];let ok=false;for(let p=1;p<=4;p++){const r=await fetch(`https://recherche-entreprises.api.gouv.fr/near_point?lat=${lat}&long=${lon}&radius=${rad}&per_page=25&page=${p}`);if(!r.ok){if(p===1)throw new Error("entreprises");break;}ok=true;const d=await r.json();const res=d.results||[];all=all.concat(res);if(res.length<25)break;}if(!ok)throw new Error("entreprises");return all;}
async function overpass(lat,lon,radKm){
  const m=Math.round(Math.min(radKm,6)*1000);
  const q=`[out:json][timeout:20];(node(around:${m},${lat},${lon})[shop];node(around:${m},${lat},${lon})[amenity~"restaurant|cafe|bar|pub|fast_food|pharmacy|fuel|bank"];);out center tags 250;`;
  const r=await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q));
  if(!r.ok)throw new Error("carte indisponible");
  const d=await r.json(); return d.elements||[];
}
function osmCat(t){const a=t.amenity,s=t.shop;
  const A={restaurant:["Restaurant","ti-tools-kitchen-2",3],cafe:["Café","ti-coffee",3],bar:["Bar","ti-glass",3],pub:["Pub","ti-beer",3],fast_food:["Restauration rapide","ti-tools-kitchen-2",3],pharmacy:["Pharmacie","ti-medical-cross",3],fuel:["Station-service","ti-gas-station",2],bank:["Banque","ti-building-bank",2]};
  if(a&&A[a])return A[a];
  const S={supermarket:["Supermarché","ti-shopping-cart",3],convenience:["Épicerie","ti-building-store",3],bakery:["Boulangerie","ti-bread",3],hairdresser:["Coiffeur","ti-cut",3],butcher:["Boucherie","ti-meat",3],car:["Automobile","ti-car",3],car_repair:["Garage","ti-car",3],clothes:["Vêtements","ti-shirt",3],florist:["Fleuriste","ti-building-store",2],optician:["Opticien","ti-building-store",2]};
  if(s&&S[s])return S[s];
  if(s)return["Commerce","ti-building-store",3];
  return["Commerce local","ti-building-store",2];
}
function parseOsm(els,clat,clon){return (els||[]).map(e=>{const t=e.tags||{};const name=t.name;if(!name)return null;const la=e.lat||(e.center&&e.center.lat),lo=e.lon||(e.center&&e.center.lon);let dist=null;if(la!=null&&lo!=null)dist=hav(clat,clon,la,lo);const[cl,ic,sc]=osmCat(t);const photo=(t.image&&/^https?:\/\//.test(t.image))?t.image:null;return{name:name,cl,ic,sc,dist,ville:t["addr:city"]||"",photo};}).filter(x=>x);}
function mergeDedupe(list){list.sort((a,b)=>b.sc-a.sc||((a.dist??1e9)-(b.dist??1e9)));const seen={},out=[];for(const x of list){const k=(x.name||"").toLowerCase().trim();if(!k||seen[k])continue;seen[k]=1;out.push(x);}return out.slice(0,60);}
function normalize(list,clat,clon){const seen={};return list.map(e=>{const et=(e.matching_etablissements&&e.matching_etablissements[0])||e.siege||{};if(et.etat_administratif&&et.etat_administratif!=="A")return null;const name=e.nom_complet||et.nom_commercial||e.nom_raison_sociale||"Établissement";const naf=et.activite_principale||e.activite_principale||"";const [cl,ic,base]=cat(naf);const el=parseFloat(et.latitude),eo=parseFloat(et.longitude);let dist=null;if(!isNaN(el)&&!isNaN(eo))dist=hav(clat,clon,el,eo);let ville=et.libelle_commune||"";if(!ville&&et.adresse){const mm=et.adresse.match(/\d{5}\s+(.+)$/);if(mm)ville=mm[1].trim();}let sc=base;if(dist!=null){if(dist<1)sc++;else if(dist>4)sc--;}return{name:cn(name),cl,ic,sc,dist,ville:cn(ville)};}).filter(x=>{if(!x||x.sc<1)return false;const k=x.name.toLowerCase();if(seen[k])return false;seen[k]=1;return true;}).sort((a,b)=>b.sc-a.sc||((a.dist??99)-(b.dist??99))).slice(0,40);}
async function run(){
  const adr=$("adr").value.trim();const rad=Math.min(20,Math.max(1,+$("ray").value||3));
  $("status").innerHTML='<span class="spin"></span> Géocodage…'; $("results").innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{const g=await geocode(adr);$("status").innerHTML='<span class="spin"></span> Recherche des commerces autour de « '+g.label+' »…';
    const [rE,rO]=await Promise.allSettled([nearby(g.lat,g.lon,rad),overpass(g.lat,g.lon,Math.min(rad,5))]);
    let a=[];if(rO.status==="fulfilled")a=a.concat(parseOsm(rO.value,g.lat,g.lon));if(rE.status==="fulfilled")a=a.concat(normalize(rE.value,g.lat,g.lon));
    prospects=mergeDedupe(a);if(!prospects.length)throw new Error("aucun résultat");
    $("status").innerHTML='<i class="ti ti-circle-check" style="color:var(--green)"></i> '+prospects.length+' commerces détectés autour de '+g.label+' (commerces locaux + entreprises).';}
  catch(err){prospects=demo();$("status").innerHTML='<i class="ti ti-alert-triangle" style="color:var(--amber)"></i> API indisponible ('+err.message+') — démonstration chargée.';}
  curPage=1;renderResults();
}
function renderResults(){
  $("rescount").textContent=prospects.length+" commerces";
  if(!prospects.length){$("results").innerHTML='<div class="empty">Aucun commerce.</div>';return;}
  const pages=Math.ceil(prospects.length/PAGE); if(curPage>pages)curPage=1;
  const start=(curPage-1)*PAGE, slice=prospects.slice(start,start+PAGE);
  let html=slice.map((p,k)=>{const i=start+k;const[l,c]=ml(p.sc);const d=p.dist!=null?(p.dist<1?Math.round(p.dist*1000)+" m":p.dist.toFixed(1)+" km"):"—";return `<div class="item">${vign(p)}<div class="grow"><div class="t">${p.name}</div><div class="s">${p.cl} · ${d}${p.ville?" · "+p.ville:""}</div></div><span class="pill ${c}">${l}</span><button class="primary" onclick="dossier(${i})"><i class="ti ti-sparkles"></i> Dossier</button></div>`;}).join("");
  if(pages>1){html+=`<div style="display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;border-top:1px solid var(--border)"><button onclick="goPage(-1)"${curPage===1?" disabled":""}><i class="ti ti-chevron-left"></i> Précédent</button><span class="muted">Page ${curPage} / ${pages}</span><button onclick="goPage(1)"${curPage===pages?" disabled":""}>Suivant <i class="ti ti-chevron-right"></i></button></div>`;}
  $("results").innerHTML=html;
}
function goPage(d){const pages=Math.ceil(prospects.length/PAGE);curPage=Math.min(pages,Math.max(1,curPage+d));renderResults();$("results").scrollIntoView({behavior:"smooth",block:"start"});}
function dossier(i){
  const p=prospects[i];const c={nom:$("nom").value||"votre club",lic:+$("lic").value||0,spec:+$("spec").value||0,res:+$("res").value||0};
  const email=`Objet : ${p.name} sur les maillots du ${c.nom} ?\n\nBonjour,\n\nJe suis en charge des partenariats du ${c.nom} — ${c.lic} licenciés et environ ${c.spec} spectateurs par match, beaucoup de familles installées à quelques minutes de chez vous.\n\nNous cherchons des partenaires locaux pour la saison. En échange d'un soutien, votre enseigne serait visible auprès de ce public : panneau au stade, logo sur nos tenues, relais réseaux (${c.res} abonnés). Trois formules, de 300 à 1 500 €.\n\nAuriez-vous 15 minutes cette semaine ?\n\nBien à vous,\n${c.nom}`;
  $("dlg-title").textContent="Dossier · "+p.name;
  $("dlg-body").innerHTML=`<p class="muted" style="margin-bottom:10px">${p.cl}${p.ville?" · "+p.ville:""}</p>
    <div class="packs"><div class="pack"><div class="tier">Bronze</div><div class="price">300 €</div><div class="muted">logo site · 4 posts/an</div></div>
    <div class="pack reco"><div class="tier">Argent</div><div class="price">800 €</div><div class="muted">+ panneau · logo short · 12 posts</div></div>
    <div class="pack"><div class="tier">Or</div><div class="price">1 500 €</div><div class="muted">+ logo maillot · match parrainé</div></div></div>
    <label style="margin-bottom:6px">Email d'approche</label><pre id="mail">${email.replace(/</g,"&lt;")}</pre>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="aiEmail(${i},this)"><i class="ti ti-sparkles"></i> Rédiger avec l'IA</button>
      <button onclick="navigator.clipboard.writeText(document.getElementById('mail').innerText);this.innerHTML='<i class=\\'ti ti-check\\'></i> Copié'"><i class="ti ti-copy"></i> Copier</button>
      <button class="primary" onclick="addPipe(${i})"><i class="ti ti-plus"></i> Ajouter au pipeline</button>
    </div>`;
  $("dlg").showModal();
}
async function addPipe(i){
  const p=prospects[i];
  const {error}=await sb.from("pipeline").insert({name:p.name,categorie:p.cl,statut:"À contacter"});
  $("dlg").close();
  if(error){alert("Erreur: "+error.message);return;}
  loadPipe();
}
async function loadPipe(){
  const {data,error}=await sb.from("pipeline").select("*").order("created_at",{ascending:false});
  if(error){$("pipeline").innerHTML='<div class="empty">Erreur: '+error.message+'</div>';return;}
  pipeData=data||[];
  renderKpis();
  $("pipcount").textContent=pipeData.length?("· "+pipeData.length):"";
  if(!pipeData.length){$("pipeline").innerHTML='<div class="empty">Ajoute un commerce depuis « Dossier ».</div>';return;}
  const opts=["À contacter","Contacté","RDV","Signé","Perdu"];
  $("pipeline").innerHTML=pipeData.map(p=>`<div class="item"><div class="ic"><i class="ti ti-building-store"></i></div>
    <div class="grow"><div class="t">${p.name}</div><div class="s">${p.categorie||""}${p.pack?" · "+p.pack:""}${p.montant?" · "+p.montant+" €":""}${p.next_action?' · <span style="color:var(--amber)">→ '+p.next_action+'</span>':""}</div></div>
    <button class="primary" onclick="openSponsor(${p.id})"><i class="ti ti-settings"></i> Gérer</button>
    <select onchange="setStatut(${p.id},this.value)" style="width:128px">${opts.map(o=>`<option ${p.statut===o?"selected":""}>${o}</option>`).join("")}</select>
    <button onclick="delPipe(${p.id})" aria-label="Supprimer" style="padding:8px"><i class="ti ti-trash"></i></button></div>`).join("");
}
function renderKpis(){
  const signes=pipeData.filter(p=>p.statut==="Signé");
  const argent=signes.reduce((s,p)=>s+(+p.montant||0),0);
  const encours=pipeData.filter(p=>p.statut&&p.statut!=="Signé"&&p.statut!=="Perdu").length;
  const actions=pipeData.filter(p=>p.next_action&&(""+p.next_action).trim()).length;
  const cards=[["Sponsors signés",signes.length,"ti-heart-handshake"],["Argent généré",argent.toLocaleString("fr-FR")+" €","ti-cash"],["Dossiers en cours",encours,"ti-clock"],["Actions à mener",actions,"ti-checklist"]];
  $("kpis").innerHTML=cards.map(c=>`<div class="kpi"><div class="kpi-l"><i class="ti ${c[2]}"></i> ${c[0]}</div><div class="kpi-v">${c[1]}</div></div>`).join("");
}
function contrepartiesFor(pack){const b={Bronze:["Logo sur le site","4 posts réseaux / an","Citation newsletter"],Argent:["Logo sur le site","Panneau au stade","Logo sur le short","12 posts réseaux","Invitation match VIP"],Or:["Logo sur le maillot","Panneau au stade","12 posts réseaux","Match parrainé à son nom","Invitation match VIP","Logo sur le site"]};return b[pack]||b.Argent;}
function actionHint(st){const m={"À contacter":"Envoyer le dossier de sponsoring + l'email d'approche.","Contacté":"Relancer sous 5 jours (appel ou passage en boutique).","RDV":"Préparer une proposition chiffrée et présenter les 3 packs.","Signé":"Générer le contrat, encaisser, planifier la livraison des contreparties.","Perdu":"Noter la raison du refus et recontacter la saison prochaine."};return m[st]||"";}
function renderCps(pack){$("sp-cps").innerHTML=contrepartiesFor(pack).map(c=>`<label class="cp"><input type="checkbox" data-cp="${c}" ${spSaved[c]?"checked":""}><span>${c}</span></label>`).join("");}
function packChanged(){const pack=$("sp-pack").value;renderCps(pack);const def={Bronze:300,Argent:800,Or:1500}[pack];const mt=$("sp-montant");if(def&&(!mt.value||mt.dataset.auto==="1")){mt.value=def;mt.dataset.auto="1";}}
function openSponsor(id){const p=pipeData.find(x=>x.id===id);if(!p)return;spSaved=p.contreparties||{};const pack=p.pack||"Argent";const opts=["À contacter","Contacté","RDV","Signé","Perdu"];
  $("dlg-title").textContent="Gérer · "+p.name;
  $("dlg-body").innerHTML=`
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div><label>Statut</label><select id="sp-statut" onchange="document.getElementById('sp-hint').textContent=actionHint(this.value)">${opts.map(o=>`<option ${p.statut===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div><label>Pack</label><select id="sp-pack" onchange="packChanged()">${["Bronze","Argent","Or"].map(o=>`<option ${pack===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div><label>Montant (€)</label><input id="sp-montant" type="number" value="${p.montant||""}"></div>
      <div><label>Prochaine action</label><input id="sp-action" value="${(p.next_action||'').replace(/"/g,'&quot;')}" placeholder="ex. relancer le 15/09"></div>
    </div>
    <div style="background:var(--accentbg);color:var(--accenttx);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px"><i class="ti ti-bulb"></i> <span id="sp-hint">${actionHint(p.statut)}</span></div>
    <label style="margin-bottom:6px">Contreparties à livrer</label>
    <div id="sp-cps" style="display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-bottom:14px"></div>
    <label>Notes</label>
    <textarea id="sp-notes" style="width:100%;min-height:70px;padding:9px 11px;border:1px solid var(--bstrong);border-radius:8px;font-family:inherit;font-size:14px" placeholder="Contacts, historique, remarques…">${(p.notes||"").replace(/</g,"&lt;")}</textarea>
    <div style="border-top:1px solid var(--border);margin:16px 0 12px"></div>
    <label style="font-weight:500;display:block;margin-bottom:8px"><i class="ti ti-mail"></i> Email au sponsor</label>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">
      <div><label>Email du contact</label><input id="sp-email" type="email" value="${(p.email_to||'').replace(/"/g,'&quot;')}" placeholder="contact@commerce.fr"></div>
      <div><label>Objet</label><input id="sp-subject" value="${(p.email_subject||'').replace(/"/g,'&quot;')}" placeholder="Partenariat avec le club"></div>
    </div>
    <textarea id="sp-body" style="width:100%;min-height:130px;padding:9px 11px;border:1px solid var(--bstrong);border-radius:8px;font-family:inherit;font-size:13.5px;line-height:1.6" placeholder="Rédige avec l'IA ou écris ton message…"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
      <button onclick="aiEmailFiche(${id},this)"><i class="ti ti-sparkles"></i> Rédiger avec l'IA</button>
      <button class="primary" onclick="sendEmail(${id},this)"><i class="ti ti-send"></i> Envoyer</button>
      <span id="sp-email-status" style="font-size:12px;color:var(--muted)">${p.email_sent_at?('Envoyé le '+new Date(p.email_sent_at).toLocaleDateString('fr-FR')+(p.email_opened_at?' · ouvert ✓':'')):''}</span>
    </div>
    <div style="border-top:1px solid var(--border);margin:16px 0 12px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="saveSponsor(${id})"><i class="ti ti-device-floppy"></i> Enregistrer</button><button onclick="genContract(${id},this)"><i class="ti ti-file-text"></i> Générer le contrat (IA)</button><button onclick="document.getElementById('dlg').close()">Fermer</button></div>
    <div id="sp-contract" style="margin-top:14px"></div>`;
  renderCps(pack);
  if(p.contrat)renderContractBox(p.contrat,id);
  $("dlg").showModal();
}
async function saveSponsor(id){const cps={};document.querySelectorAll("#sp-cps input[type=checkbox]").forEach(cb=>{cps[cb.dataset.cp]=cb.checked;});
  const row={statut:$("sp-statut").value,pack:$("sp-pack").value,montant:(+$("sp-montant").value||null),next_action:$("sp-action").value,notes:$("sp-notes").value,contreparties:cps};
  const {error}=await sb.from("pipeline").update(row).eq("id",id);
  if(error){alert("Erreur: "+error.message);return;}
  $("dlg").close();loadPipe();}
async function setStatut(id,v){ await sb.from("pipeline").update({statut:v}).eq("id",id); }
async function delPipe(id){ await sb.from("pipeline").delete().eq("id",id); loadPipe(); }
async function aiGenerate(type,data){
  const r=await fetch("/api/generate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type,data})});
  const j=await r.json().catch(()=>({error:"réponse invalide"}));
  if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));
  return j.text;
}
async function aiEmail(i,btn){const p=prospects[i];const el=document.getElementById("mail");const old=el.innerText;const bo=btn?btn.innerHTML:"";
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Rédaction…';}
  el.innerHTML='<span class="spin"></span> Rédaction par l\'IA…';
  try{const t=await aiGenerate("email",{club:$("nom").value,sport:$("sport").value,lic:+$("lic").value,spec:+$("spec").value,res:+$("res").value,sponsor:p.name,categorie:p.cl});el.innerText=t;}
  catch(e){el.innerText=old;alert("IA indisponible : "+e.message);}
  finally{if(btn){btn.disabled=false;btn.innerHTML=bo;}}}
async function genContract(id,btn){const p=pipeData.find(x=>x.id===id);const box=document.getElementById("sp-contract");const bo=btn?btn.innerHTML:"";
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Rédaction…';}
  box.innerHTML='<div style="padding:8px 0"><span class="spin"></span> Rédaction du contrat par l\'IA…</div>';
  const pack=$("sp-pack").value;
  const cps=contrepartiesFor(pack).filter(c=>{const cb=document.querySelector('#sp-cps input[data-cp="'+c+'"]');return cb&&cb.checked;});
  try{const t=await aiGenerate("contrat",{club:$("nom").value,sport:$("sport").value,lic:+$("lic").value,spec:+$("spec").value,res:+$("res").value,sponsor:p.name,montant:$("sp-montant").value,contreparties:cps.length?cps:contrepartiesFor(pack)});
    await sb.from("pipeline").update({contrat:t}).eq("id",id);const pp=pipeData.find(x=>x.id===id);if(pp)pp.contrat=t;
    renderContractBox(t,id);}
  catch(e){box.innerHTML='<div style="color:#a12;font-size:13px">IA indisponible : '+e.message+'</div>';}
  finally{if(btn){btn.disabled=false;btn.innerHTML=bo;}}}
async function aiEmailFiche(id,btn){const p=pipeData.find(x=>x.id===id);const bo=btn?btn.innerHTML:"";if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Rédaction…';}
  try{const t=await aiGenerate("email",{club:$("nom").value,sport:$("sport").value,lic:+$("lic").value,spec:+$("spec").value,res:+$("res").value,sponsor:p.name,categorie:p.categorie});
    let subj="",body=t;const mm=t.match(/objet\s*:\s*(.+)/i);if(mm){subj=mm[1].split("\n")[0].trim();body=t.replace(/objet\s*:.*(\r?\n)?/i,"").trim();}
    if(subj)$("sp-subject").value=subj;$("sp-body").value=body;}
  catch(e){alert("IA indisponible : "+e.message);}
  finally{if(btn){btn.disabled=false;btn.innerHTML=bo;}}}
async function sendEmail(id,btn){const to=$("sp-email").value.trim(),subject=$("sp-subject").value.trim(),body=$("sp-body").value.trim();
  if(!to||!subject||!body){alert("Renseigne l'email du contact, l'objet et le message.");return;}
  const bo=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Envoi…';
  const track=location.origin+"/api/track?id="+id;
  const html=body.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>")+'<img src="'+track+'" width="1" height="1" style="display:none" alt="">';
  try{const r=await fetch("/api/send",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({to,subject,html,fromName:$("nom").value||"Sponsoclub",replyTo:(user&&user.email)||""})});
    const j=await r.json().catch(()=>({error:"réponse invalide"}));if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));
    await sb.from("pipeline").update({email_to:to,email_subject:subject,email_sent_at:new Date().toISOString(),statut:"Contacté"}).eq("id",id);
    const p=pipeData.find(x=>x.id===id);if(p){p.email_to=to;p.email_subject=subject;p.email_sent_at=new Date().toISOString();p.statut="Contacté";}
    const st=document.getElementById("sp-email-status");if(st){st.style.color="var(--green)";st.textContent="Envoyé ✓";}
    loadPipe();}
  catch(e){alert("Envoi impossible : "+e.message);}
  finally{btn.disabled=false;btn.innerHTML=bo;}}
function dlDoc(taId,name){const ta=document.getElementById(taId);const esc=ta.value.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.5">'+esc+'</body></html>';const blob=new Blob(["﻿",html],{type:"application/msword"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(name||"document")+".doc";document.body.appendChild(a);a.click();a.remove();}
function renderContractBox(text,id){document.getElementById("sp-contract").innerHTML=`<label style="margin:6px 0 4px;display:block">Contrat (modifiable — enregistré sur la fiche)</label><textarea id="ct-out" style="width:100%;min-height:200px;padding:10px 12px;border:1px solid var(--bstrong);border-radius:8px;font-family:inherit;font-size:13px;line-height:1.6">${(text||"").replace(/</g,"&lt;")}</textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><button class="primary" onclick="saveContract(${id})"><i class="ti ti-device-floppy"></i> Enregistrer le contrat</button><button onclick="dlDoc('ct-out','contrat-sponsoclub')"><i class="ti ti-file-word"></i> Télécharger (Word)</button><span id="ct-status" style="color:var(--green);font-size:12px"></span></div>`;}
async function saveContract(id){const ta=document.getElementById("ct-out");const {error}=await sb.from("pipeline").update({contrat:ta.value}).eq("id",id);const p=pipeData.find(x=>x.id===id);if(p)p.contrat=ta.value;const st=document.getElementById("ct-status");if(st){if(error){st.style.color="#a12";st.textContent="Erreur : "+error.message;}else{st.style.color="var(--green)";st.textContent="Enregistré ✓";}}}
function demo(){return [
  {name:"Garage Central",cl:"Automobile",ic:"ti-car",dist:1.2,sc:4,ville:"Villeneuve"},
  {name:"Boulangerie Moreau",cl:"Alimentaire",ic:"ti-bread",dist:0.6,sc:4,ville:"Villeneuve"},
  {name:"Pizza Bella",cl:"Restauration",ic:"ti-tools-kitchen-2",dist:0.9,sc:4,ville:"Villeneuve"},
  {name:"Agence Immo du Parc",cl:"Immobilier",ic:"ti-home",dist:2.4,sc:3,ville:"Villeneuve"}
];}
</script>
</body>
