<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsoclub — Console admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
  :root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--text:#1a1d21;--muted:#6b7280;--faint:#9ca3af;--border:#e5e7eb;--bstrong:#d1d5db;--accent:#3b4cd8;--green:#159169;--amber:#b5730f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-size:14px}
  .top{background:#14161c;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px}
  .top .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px}
  .top h1{font-size:16px;font-weight:600}
  .top .tag{margin-left:auto;font-size:12px;color:#9aa0b0}
  .wrap{max-width:900px;margin:0 auto;padding:28px 24px}
  input{padding:10px 12px;border:1px solid var(--bstrong);border-radius:8px;font-family:inherit;font-size:14px;width:100%}
  button{font-family:inherit;font-size:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  button:hover{background:#3341bf}
  .login{max-width:360px;margin:8vh auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 24px;box-shadow:0 4px 20px rgba(16,24,40,.06)}
  .login h2{font-size:17px;margin-bottom:16px;text-align:center}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:8px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .kpi .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .kpi .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .kpi .s{font-size:12px;color:var(--faint);margin-top:4px}
  .msg{font-size:13px;margin-top:12px;color:#a12;display:none}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  h2.sec{font-size:18px}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i class="ti ti-trophy"></i></div>
  <h1>Sponsoclub</h1>
  <span class="tag">Console admin</span>
</div>

<div id="login" class="login">
  <h2>Console admin</h2>
  <input id="tok" type="password" placeholder="Mot de passe admin">
  <button style="width:100%;justify-content:center;margin-top:12px" onclick="enter()">Accéder</button>
  <div id="login-msg" class="msg"></div>
</div>

<div id="dash" class="wrap" style="display:none">
  <div class="head">
    <h2 class="sec">Vue d'ensemble</h2>
    <button onclick="load()" style="background:var(--surface);color:var(--text);border-color:var(--bstrong)"><i class="ti ti-refresh"></i> Actualiser</button>
  </div>
  <div class="metrics" id="metrics"></div>
  <p style="font-size:12px;color:var(--faint);margin-top:18px">Le MRR est « projeté » (clubs actifs × prix d'abonnement supposé) tant que la facturation n'est pas branchée. Le sponsoring total est le montant réel signé, cumulé sur tous les clubs.</p>
</div>

<script>
let TOKEN="";
function enter(){TOKEN=document.getElementById("tok").value.trim();if(!TOKEN)return;load();}
async function load(){
  const m=document.getElementById("login-msg");m.style.display="none";
  try{
    const r=await fetch("/api/admin?token="+encodeURIComponent(TOKEN));
    const j=await r.json();
    if(!r.ok||j.error)throw new Error(j.error||("HTTP "+r.status));
    document.getElementById("login").style.display="none";
    document.getElementById("dash").style.display="block";
    render(j);
  }catch(e){m.textContent=e.message;m.style.display="block";document.getElementById("login").style.display="block";document.getElementById("dash").style.display="none";}
}
function eur(n){return (n||0).toLocaleString("fr-FR")+" €";}
function render(j){
  const cards=[
    ["Clubs inscrits",j.clubs,"ti-users-group",""],
    ["Sponsoring total généré",eur(j.sponsoring),"ti-cash",j.signes+" sponsors signés"],
    ["MRR projeté",eur(j.mrr),"ti-chart-line",j.clubs+" clubs × "+j.prix+" €"],
    ["Sponsors signés",j.signes,"ti-heart-handshake",""],
    ["Dossiers au total",j.total,"ti-folder","tous clubs confondus"],
  ];
  document.getElementById("metrics").innerHTML=cards.map(c=>`<div class="kpi"><div class="l"><i class="ti ${c[2]}"></i> ${c[0]}</div><div class="v">${c[1]}</div>${c[3]?`<div class="s">${c[3]}</div>`:""}</div>`).join("");
}
</script>
</body>
</html>
