<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace partenaire</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
  :root{--accent:#3b4cd8;--sec:#e0b400;--bg:#f4f5f7;--surface:#fff;--text:#15171c;--muted:#6b7280;--faint:#9aa1ab;--border:#eceef1;--green:#159169;--greenbg:#e6f6ef;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  /* HERO */
  .hero{position:relative;overflow:hidden;color:#fff;padding:46px 24px 66px;text-align:center;
    background:radial-gradient(130% 120% at 50% -10%, color-mix(in srgb,var(--accent) 82%,#fff) 0%, var(--accent) 42%, color-mix(in srgb,var(--accent) 55%,#000) 100%);
    border-radius:0 0 30px 30px}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,var(--sec),transparent);opacity:.9}
  .hero .halo{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sec) 30%,transparent),transparent 70%);top:-140px;left:50%;transform:translateX(-50%);pointer-events:none}
  .hero .logo{position:relative;width:88px;height:88px;border-radius:22px;background:#fff;object-fit:contain;padding:9px;margin:0 auto 18px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .hero .logoph{position:relative;width:88px;height:88px;border-radius:22px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .hero .eyebrow{position:relative;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--sec);margin-bottom:10px}
  .hero h1{position:relative;font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .hero .sub{position:relative;font-size:15px;color:rgba(255,255,255,.82);margin-top:12px;max-width:440px;margin-left:auto;margin-right:auto}
  .hero .sub b{color:#fff}
  /* CONTENT */
  .wrap{max-width:640px;margin:-42px auto 46px;padding:0 18px;position:relative;z-index:2}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px 24px;margin-bottom:16px;box-shadow:0 8px 30px rgba(16,24,40,.06)}
  .section-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 6px 12px}
  .wrap>.section-h:first-child{margin-top:0}
  .ptabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:18px;box-shadow:0 6px 20px rgba(16,24,40,.06)}
  .ptab{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:11px 6px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .ptab i{font-size:16px}
  .ptab.active{background:var(--accent);color:#fff}
  .ptabp{display:none}.ptabp.on{display:block}
  .empty2{text-align:center;color:var(--faint);padding:26px 12px;font-size:14px}
  @media(max-width:520px){.ptab{font-size:12px;padding:10px 4px}.ptab i{font-size:15px}}
  .card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:9px;font-weight:700}
  .card h2 .chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent)}
  /* PACK */
  .packrow{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .pack{font-size:23px;font-weight:800;letter-spacing:-.01em}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;background:#f1f3f5;color:var(--muted);margin-top:10px}
  .status.ok{background:var(--greenbg);color:var(--green)}
  .amount{font-size:24px;font-weight:800;color:var(--accent);white-space:nowrap}
  .amount small{font-size:13px;color:var(--faint);font-weight:600}
  .defisc{margin-top:16px;font-size:14px;color:var(--green);background:var(--greenbg);padding:12px 15px;border-radius:12px;display:flex;align-items:center;gap:10px;line-height:1.4}
  .defisc i{font-size:19px;flex-shrink:0}
  /* CONTREPARTIES */
  .prog{height:9px;border-radius:6px;background:#eef0f3;overflow:hidden;margin-bottom:8px}
  .prog>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sec),var(--green));transition:width .5s}
  .progtxt{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:500}
  .cp{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border);font-size:14.5px}
  .cp:last-child{border-bottom:none;padding-bottom:0}
  .cp .ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .cp .ok{background:var(--greenbg);color:var(--green)}
  .cp .wait{background:#f1f3f5;color:var(--faint)}
  .cp .lbl{flex:1}
  .cp .lbl.done{color:var(--muted)}
  .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:#f1f3f5;color:var(--faint);white-space:nowrap}
  .badge.ok{background:var(--greenbg);color:var(--green)}
  /* IMPACT */
  .impact{background:linear-gradient(150deg,color-mix(in srgb,var(--sec) 14%,#fff),var(--surface) 70%);border-color:color-mix(in srgb,var(--sec) 34%,#fff)}
  .impact .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .impact .big small{font-size:15px;font-weight:600;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px}
  .stat{text-align:center;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:14px;padding:16px 8px}
  .stat .v{font-size:23px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.35}
  .note{font-size:12.5px;color:var(--faint);margin-top:16px;line-height:1.5}
  .posts{display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
  .post{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}
  .post img.post-photo{width:100%;max-height:320px;object-fit:cover;display:block}
  .post iframe{width:100%;border:0;display:block}
  .post-b{padding:11px 14px}
  .post-cap{font-size:13.5px;line-height:1.45;color:var(--text);margin-bottom:6px}
  .post-link{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600}
  /* FORM RECU */
  .frm{display:grid;margin-bottom:16px}
  .frm label{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px;margin-bottom:4px}
  .frm input{padding:11px 13px;border:1px solid #d9dce1;border-radius:10px;font-family:inherit;font-size:14.5px;width:100%;color:var(--text)}
  .frm input:focus{outline:none;border-color:var(--accent)}
  .dlbtn{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:8px;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .dlbtn:hover{filter:brightness(1.07)}
  .warn{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;display:flex;gap:8px;background:#f7f8fa;padding:11px 13px;border-radius:10px}
  .warn i{color:var(--sec);font-size:16px;flex-shrink:0;margin-top:1px}
  /* FOOT */
  .foot{text-align:center;font-size:12.5px;color:var(--faint);padding:6px 0 34px}
  .foot a{color:var(--muted);text-decoration:none;font-weight:600}
  .center{text-align:center}
  .spin{width:28px;height:28px;border:3px solid #d9dce1;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{max-width:440px;margin:16vh auto;text-align:center;padding:0 24px;color:var(--muted)}
  .err i{font-size:46px;color:var(--faint)}
  .err h1{font-size:21px;color:var(--text);margin:16px 0 8px}
  @media(max-width:520px){.stats{grid-template-columns:1fr;gap:9px}.hero h1{font-size:24px}.impact .big{font-size:29px}}
</style>
</head>
<body>
<div id="app"><div class="center" style="padding:22vh 0"><span class="spin"></span></div></div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function nb(n){return (n||0).toLocaleString("fr-FR");}
async function load(){
  const token=(location.hash||"").replace(/^#/,"").trim();
  if(!token){return fail("Lien incomplet","Ce lien ne contient pas d'identifiant d'espace.");}
  try{
    const r=await fetch("/api/espace?token="+encodeURIComponent(token));
    let j;try{j=await r.json();}catch(_){throw new Error("La page n'a pas pu charger les données.");}
    if(!r.ok||j.error)throw new Error(j.error||"Erreur");
    render(j);
  }catch(e){fail("Espace introuvable","Ce lien a peut-être expiré ou n'est plus valide.");}
}
function fail(t,m){$("app").innerHTML=`<div class="err"><i class="ti ti-link-off"></i><h1>${esc(t)}</h1><p>${esc(m)}</p></div>`;}
let CLUB=null,SPONSOR=null;
function postEmbed(u){
  u=(u||'').trim();if(!u)return null;
  // Code d'intégration collé directement (on ne garde que le src, pas de script)
  const code=u.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
  if(code) return `<iframe src="${code[1].replace(/"/g,'&quot;')}" style="height:600px" scrolling="no" allowfullscreen loading="lazy"></iframe>`;
  const ig=u.match(/instagram\.com\/(?:[^\/?]+\/)?(p|reel|tv)\/([A-Za-z0-9_-]+)/i);
  if(ig) return `<iframe src="https://www.instagram.com/${ig[1].toLowerCase()}/${ig[2]}/embed" style="height:660px" scrolling="no" loading="lazy"></iframe>`;
  if(/facebook\.com|fb\.watch|fb\.me/i.test(u)) return `<iframe src="https://www.facebook.com/plugins/post.php?href=${encodeURIComponent(u)}&show_text=true&width=500" style="height:600px" scrolling="no" allowfullscreen loading="lazy"></iframe>`;
  const yt=u.match(/[?&]v=([^&]+)/)||u.match(/youtu\.be\/([^?]+)/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" style="aspect-ratio:16/9;height:auto" allowfullscreen loading="lazy"></iframe>`;
  return null;
}
function render(d){
  const c=d.club,s=d.sponsor,cps=d.contreparties||[];CLUB=c;SPONSOR=s;
  document.documentElement.style.setProperty("--accent",c.primary||"#3b4cd8");
  document.documentElement.style.setProperty("--sec",c.secondary||"#e0b400");
  document.title="Espace partenaire · "+c.nom;
  const logo=c.logo?`<img class="logo" src="${c.logo}" alt="">`:`<div class="logoph"><i class="ti ti-trophy"></i></div>`;
  const done=cps.filter(x=>x.done).length;
  const pct=cps.length?Math.round(done/cps.length*100):0;
  const matchs=c.viz_matchs||15;
  const posts=c.viz_posts||20;
  const portee=(c.viz_portee!=null?c.viz_portee:40)/100;
  const ent=c.viz_entourage||2;
  const vueStade=(c.spectateurs||0)*matchs;
  const vueRes=Math.round((c.reseaux||0)*portee*posts);
  const vueFoyers=(c.licencies||0)*ent;
  const total=vueStade+vueRes+vueFoyers;
  const moisExpo=9;
  const defisc=(c.mecenat&&s.montant)?`<div class="defisc"><i class="ti ti-discount-2"></i><div>Grâce au mécénat, après réduction d'impôt de 60 %, votre soutien ne vous coûte réellement que <b>${nb(Math.round(s.montant*0.4))} €</b>.</div></div>`:"";
  const statusTag = s.regle?`<span class="status ok"><i class="ti ti-circle-check-filled"></i> Partenariat réglé</span>`:(s.signe?`<span class="status ok"><i class="ti ti-writing-sign"></i> Contrat signé</span>`:`<span class="status">Partenariat en cours</span>`);
  $("app").innerHTML=`
  <div class="hero">
    <div class="halo"></div>
    ${logo}
    <div class="eyebrow">Espace partenaire</div>
    <h1>${esc(c.nom)}</h1>
    <div class="sub">Merci à <b>${esc(s.name)}</b> pour son soutien${c.sport?` au ${esc(c.sport.toLowerCase())}`:""}.</div>
  </div>
  <div class="wrap">
    <div class="ptabs">
      <button class="ptab active" data-t="spo" onclick="espTab('spo')"><i class="ti ti-award"></i> Sponsoring</button>
      <button class="ptab" data-t="act" onclick="espTab('act')"><i class="ti ti-news"></i> Actualités</button>
      <button class="ptab" data-t="doc" onclick="espTab('doc')"><i class="ti ti-file-invoice"></i> Reçu &amp; docs</button>
    </div>
    <div class="ptabp on" data-t="spo">
    <div class="card">
      <h2><span class="chip"><i class="ti ti-award"></i></span> Votre partenariat</h2>
      <div class="packrow">
        <div><div class="pack">Formule ${esc(s.pack||"—")}</div>${statusTag}</div>
        ${s.montant?`<div class="amount">${nb(s.montant)} €<br><small>par saison</small></div>`:""}
      </div>
      ${defisc}
    </div>

    <div class="card">
      <h2><span class="chip"><i class="ti ti-checklist"></i></span> Vos contreparties</h2>
      ${cps.length?`
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="progtxt">${done} / ${cps.length} livrée${done>1?'s':''}${pct===100?" — tout est en place ✅":""}</div>
        <div>${cps.map(x=>`<div class="cp"><span class="ico ${x.done?'ok':'wait'}"><i class="ti ${x.done?'ti-check':'ti-clock'}"></i></span><span class="lbl ${x.done?'done':''}">${esc(x.label)}</span><span class="badge ${x.done?'ok':''}">${x.done?'Livré':'À venir'}</span></div>`).join("")}</div>
      `:`<p style="color:var(--muted)">Les contreparties de votre formule seront détaillées ici prochainement.</p>`}
    </div>

    <div class="card impact">
      <h2><span class="chip"><i class="ti ti-map-pin"></i></span> Votre exposition locale</h2>
      <div class="big">≈ ${nb(total)} fois <small>votre logo vu cette saison</small></div>
      <div class="stats" style="margin-top:20px">
        <div class="stat"><i class="ti ti-users" style="font-size:22px;color:var(--accent)"></i><div class="v" style="font-size:21px;margin-top:6px">${nb(c.spectateurs)}</div><div class="l">spectateurs à chaque match</div></div>
        <div class="stat"><i class="ti ti-device-mobile" style="font-size:22px;color:var(--accent)"></i><div class="v" style="font-size:21px;margin-top:6px">${nb(c.reseaux)}</div><div class="l">abonnés sur les réseaux du club</div></div>
        <div class="stat"><i class="ti ti-home-heart" style="font-size:22px;color:var(--accent)"></i><div class="v" style="font-size:21px;margin-top:6px">${nb(c.licencies)}</div><div class="l">familles du club, près de chez vous</div></div>
      </div>
      <div class="note">Votre marque présente toute la saison (~${moisExpo} mois) : panneau au stade, maillots et réseaux. Une audience locale et fidèle.</div>
    </div>
    </div>

    <div class="ptabp" data-t="act">
    ${(d.posts&&d.posts.length)?`
    <div class="card">
      <h2><span class="chip"><i class="ti ti-brand-instagram"></i></span> ${c.nom} parle de vous</h2>
      <div class="posts">
        ${d.posts.map(po=>{
          const emb=postEmbed(po.url);
          const isCode=/<iframe/i.test(po.url||'');
          const href=isCode?((po.url.match(/src=["']([^"']+)["']/i)||[])[1]||''):(po.url||'');
          const link=(href&&/^https?:/i.test(href))?`<a href="${esc(href)}" target="_blank" class="post-link"><i class="ti ti-external-link"></i> Voir le post</a>`:'';
          const capTxt=po.caption?`<div class="post-cap">${esc(po.caption)}</div>`:'';
          const body=(capTxt||link)?`<div class="post-b">${capTxt}${link}</div>`:'';
          if(emb)return `<div class="post">${emb}${body}</div>`;
          if(po.image)return `<div class="post"><img class="post-photo" src="${esc(po.image)}" alt="" onerror="this.remove()">${body}</div>`;
          return `<div class="post">${body||'<div class="post-b post-cap">Publication</div>'}</div>`;
        }).join("")}
      </div>
    </div>`:`<div class="card"><div class="empty2">Pas encore d'actualité publiée. Revenez bientôt !</div></div>`}
    </div>

    <div class="ptabp" data-t="doc">
    ${(c.mecenat&&s.montant)?`
    <div class="card">
      <h2><span class="chip"><i class="ti ti-receipt-tax"></i></span> Votre reçu fiscal (mécénat)</h2>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:4px">Complétez vos informations légales pour générer votre reçu fiscal (reproduction du Cerfa n°16216), à conserver pour votre déclaration et bénéficier de la réduction d'impôt de 60 %.</p>
      <div class="frm">
        <label>Raison sociale de l'entreprise</label><input id="r-nom" value="${esc(s.name)}">
        <label>Adresse complète</label><input id="r-adr" placeholder="N°, rue, code postal, ville">
        <label>N° SIREN</label><input id="r-siren" placeholder="123 456 789">
        <label>Date du versement du don</label><input id="r-date" type="date">
      </div>
      <button class="dlbtn" onclick="downloadRecu()"><i class="ti ti-download"></i> Télécharger le reçu fiscal</button>
      <div class="warn"><i class="ti ti-info-circle"></i><div>Reçu valable pour un <b>don de mécénat</b> (contreparties symboliques ≤ 25 % du montant), à délivrer une fois le don encaissé. Si vous bénéficiez de contreparties publicitaires importantes (logo maillot, panneau…), il s'agit de <b>parrainage</b> : demandez plutôt une facture au club.</div></div>
    </div>`:""}
    ${s.contrat?`
    <div class="card">
      <h2><span class="chip"><i class="ti ti-file-text"></i></span> Votre contrat</h2>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Votre contrat de partenariat, signé avec le club.</p>
      <button class="dlbtn" style="background:var(--surface);color:var(--text);border:1px solid #d9dce1" onclick="downloadContrat()"><i class="ti ti-download"></i> Télécharger le contrat signé</button>
    </div>`:""}
    ${(!(c.mecenat&&s.montant)&&!s.contrat)?`<div class="card"><div class="empty2">Aucun document disponible pour l'instant.</div></div>`:""}
    </div>

    <div class="foot">Espace généré par <a href="https://sponsoclub.fr" target="_blank">Sponsoclub</a> pour ${esc(c.nom)}.</div>
  </div>`;
}
function val(id){const e=$(id);return e?e.value.trim():"";}
function enLettres(n){
  n=Math.round(Math.abs(n));if(n===0)return"zéro";
  const u=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const d=["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  function cent(x){let r="";const c=Math.floor(x/100);x=x%100;
    if(c>1)r+=u[c]+" cent"+(x===0?"s":"")+" ";else if(c===1)r+="cent ";
    if(x>=20){const di=Math.floor(x/10),un=x%10;
      if(di===7||di===9){r+=d[di];if(di===7&&un===1)r+=" et "+u[11];else r+="-"+u[10+un];}
      else{r+=d[di];if(un===1&&di!==8)r+=" et un";else if(un>0)r+="-"+u[un];else if(di===8)r+="s";}
    }else if(x>0)r+=u[x];
    return r.trim();}
  let r="";const mi=Math.floor(n/1000000);n%=1000000;const mille=Math.floor(n/1000);n%=1000;
  if(mi>0)r+=(mi>1?cent(mi)+" millions ":"un million ");
  if(mille>0)r+=(mille>1?cent(mille)+" mille ":"mille ");
  if(n>0)r+=cent(n);
  return r.trim();
}
function downloadRecu(){
  const nom=val("r-nom"),adr=val("r-adr"),siren=val("r-siren"),date=val("r-date");
  if(!nom||!adr){alert("Merci de renseigner la raison sociale et l'adresse de l'entreprise.");return;}
  const c=CLUB,s=SPONSOR,montant=s.montant||0;
  const dstr=date?new Date(date).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}):"____________________";
  const today=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
  const num="MEC-"+new Date().getFullYear()+"-"+String(s.id||Math.floor(Math.random()*9000+1000));
  const ville=(c.ville||c.adresse||"").replace(/^\d{4,5}\s*/,"")||"____________";
  const row=(l,v)=>`<tr><td class="l">${l}</td><td class="v">${v||"&nbsp;"}</td></tr>`;
