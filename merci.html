<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Sponsoclub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{background:#f4f5f7;color:#15171c;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{background:#fff;border:1px solid #eceef1;border-radius:20px;padding:40px 32px;max-width:440px;text-align:center;box-shadow:0 10px 40px rgba(16,24,40,.08)}
  .ico{width:72px;height:72px;border-radius:50%;background:#e6f6ef;color:#159169;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 18px}
  h1{font-size:22px;margin-bottom:10px}
  p{color:#6b7280;font-size:15px;line-height:1.55}
  .annule .ico{background:#fbf0dd;color:#b5730f}
  a{color:#3b4cd8;text-decoration:none;font-weight:600;font-size:14px;display:inline-block;margin-top:18px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="ico"><i class="ti ti-circle-check"></i></div>
  <h1>Merci pour votre soutien !</h1>
  <p>Votre paiement a bien été enregistré. Le club en est informé automatiquement. Vous pouvez fermer cette page.</p>
</div>
<script>
  if(new URLSearchParams(location.search).get("annule")==="1"){
    const c=document.getElementById("card");c.classList.add("annule");
    c.innerHTML='<div class="ico"><i class="ti ti-x"></i></div><h1>Paiement annulé</h1><p>Aucun montant n\'a été prélevé. Vous pouvez relancer le paiement depuis le lien fourni par le club.</p>';
  }
</script>
</body>
</html>
